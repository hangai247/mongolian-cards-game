<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Naiman Gar · 43-card deck</title>
<link rel="stylesheet" href="../dist/card-system.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#11292d;color:#fff7e6;font-family:Arial,sans-serif;--app-font:Arial,sans-serif}main{max-width:1440px;margin:auto;padding:48px 52px}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #cbb57b44;padding-bottom:24px;margin-bottom:38px}.eyebrow{font-size:10px;letter-spacing:.25em;color:#d2b880;margin:0 0 14px}h1{font:700 54px/1 Arial,sans-serif;margin:0;letter-spacing:-.04em}.sub{font-size:12px;color:#b1c0b9;max-width:245px;line-height:1.7;margin:0}#detail{display:grid;grid-template-columns:repeat(7,1fr);gap:24px;align-items:center}.card{display:block;position:relative;width:100%;aspect-ratio:200/308;flex:none}figure{margin:0;min-width:0}figcaption{font-size:9px;letter-spacing:.17em;color:#bdc8c0;margin-top:18px;text-align:center;text-transform:uppercase}.deck-heading{margin:54px 0 22px;display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid #cbb57b44;padding-top:26px}h2{font:normal 25px Georgia,serif;margin:0}.deck-heading span{font-size:10px;letter-spacing:.12em;color:#afbeb7}#deck{display:grid;grid-template-columns:repeat(10,1fr);gap:16px 14px}footer{margin-top:26px;font-size:10px;letter-spacing:.08em;color:#95aaa3;line-height:1.6}@media(max-width:700px){main{padding:26px 20px}header{display:block}h1{font-size:40px}.sub{margin-top:18px}#detail{grid-template-columns:repeat(3,1fr);gap:24px 16px}#deck{grid-template-columns:repeat(5,1fr);gap:12px 8px}.deck-heading{display:block}.deck-heading span{display:block;margin-top:12px}figcaption{font-size:8px;letter-spacing:.06em}}
</style>
<body class="ger-table"><main><header><div><p class="eyebrow">НАЙМАН ГАР · PLAYING CARDS</p><h1>Naiman / Modern.</h1></div><p class="sub">Built for the hand. Designed for the game.<br>A complete new visual system for 43 cards.</p></header><section id="detail" aria-label="Card design details"></section><div class="deck-heading"><h2>The complete 43-card deck</h2><span>40 SUITED CARDS &nbsp; / &nbsp; 3 JOKERS</span></div><section id="deck" aria-label="All 43 actual playing cards"></section><footer>Actual game renderer · 7, 8, 9, 10, J, Q, K, 3, 2, A in each suit · Gray, black and red jokers</footer></main>
<script type="module">
import {createDeck} from '../dist/rules/engine.js';
import {makePlayingCard} from '../dist/card-system.js';
const deck=createDeck(),find=(suit,rank)=>deck.find(c=>c.suit===suit&&c.rank===rank);
const examples=[[find('spades','A'),'Signature ace'],[find('hearts','7'),'Clear number cards'],[find('hearts','Q'),'The queen'],[find('spades','K'),'The king'],[find('diamonds','J'),'The jack'],[deck.find(c=>c.color==='red'),'Sun joker · I'],[{id:'back',kind:'back'},'Geometric reverse']];
for(const [card,label] of examples){const figure=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=label;figure.append(makePlayingCard(card),caption);document.querySelector('#detail').append(figure)}
for(const card of deck)document.querySelector('#deck').append(makePlayingCard(card));
</script></body></html>
