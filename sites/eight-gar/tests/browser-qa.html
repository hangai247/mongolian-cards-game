<!doctype html><meta charset="utf-8"><title>Practice table layout checks</title>
<style>[hidden]{display:none!important}body{margin:0;background:#eee;color:#222;font:14px system-ui}header{position:sticky;top:0;z-index:2;background:#fff;padding:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{padding:8px}iframe{display:block;border:0;margin:12px auto;background:#17130f}pre{white-space:pre-wrap;margin:15px}#output{max-height:180px;overflow:auto}</style>
<header><strong>Practice table QA</strong><label>Width <select id="width"><option>320</option><option selected>390</option><option>700</option><option>1440</option></select></label><label>Height <input id="height" type="number" value="844" min="300" max="1600" style="width:65px;padding:8px"></label><label>Scenario <select id="scenario"><option value="defense">Three-card defense</option><option value="five">Five-card defense</option><option value="sleep">Sleep with refill</option><option value="win">Winning eighth play</option><option value="pickup">Large pickup</option></select></label><button id="load">Load scenario</button><button id="run">Run browser checks</button><button id="clean">Clean preview</button><span id="status">Ready</span></header>
<pre id="output"></pre><iframe id="game" title="Practice table preview" width="390" height="844"></iframe>
<script type="module">
import {createDeck,createMatch,RANKS} from '../dist/rules/engine.js';
const frame=document.querySelector('#game'), report=document.querySelector('#output'), status=document.querySelector('#status');
const cards=createDeck(),card=(suit,rank)=>cards.find(c=>c.suit===suit&&c.rank===rank), joker=color=>cards.find(c=>c.color===color);
const h=r=>card('hearts',r),s=r=>card('spades',r),d=r=>card('diamonds',r),b=r=>card('clubs',r);
let errors=[];
function fixture(kind){
 const targets=kind==='defense'?[s('7'),h('7'),b('7')]:kind==='five'?[s('7'),d('7'),b('7'),s('8'),d('8')]:RANKS.slice(0,7).map(s);
 let own=kind==='defense'?[h('8'),s('8'),b('8'),d('9')]:kind==='five'?['9','10','J','Q','K'].map(h):[s('3')];
 let pile=targets,reserve=kind==='sleep'?[joker('red')]:[];
 if(kind==='pickup'){pile=cards.filter(c=>!own.includes(c)).slice(0,12);}
 const used=new Set([...pile,...own,...reserve].map(c=>c.id)),pool=cards.filter(c=>!used.has(c.id));
 const hands=[own,...Array.from({length:7},()=>[pool.shift()])];hands[7].push(...pool);
 return {...createMatch(cards,0),hands,reserve,table:{pile,highest:kind==='pickup'?pile.slice(-3):['defense','five'].includes(kind)?targets:targets.slice(-1)}};
}
function waitFor(check,label='condition',timeout=5000){return new Promise((resolve,reject)=>{const start=performance.now();function poll(){try{if(check())return resolve();}catch{}if(performance.now()-start>timeout)return reject(new Error('Timed out: '+label));setTimeout(poll,20);}poll();});}
function saveState(state){localStorage.setItem('naiman-gar-practice-v1',JSON.stringify({format:2,state,byRank:false,signals:[]}));}
async function load(kind='defense',width=390,height=844,flags={}){
 frame.width=width;frame.height=height;saveState(fixture(kind));
 // An old saved focus/mute choice must not override the always-on portrait experience.
 localStorage.setItem('naiman-gar-table-preferences-v1',JSON.stringify({sound:false,motion:false,focus:true}));
 const loaded=new Promise(resolve=>frame.onload=resolve);
 if(Object.keys(flags).length){
  const html=await (await fetch('../dist/practice.html')).text();
  let shim='';
  if(flags.noWebGL)shim+=`const getContext=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(type,...args){return type.includes('webgl')?null:getContext.call(this,type,...args);};`;
  if(flags.reduced)shim+=`const originalMedia=window.matchMedia;window.matchMedia=query=>{const media=originalMedia(query);if(query.includes('prefers-reduced-motion'))Object.defineProperty(media,'matches',{value:true});return media;};`;
  if(flags.noAudio)shim+=`window.AudioContext=class{constructor(){throw new Error('Audio unavailable in test')}};`;
  frame.srcdoc=html.replace('<head>',`<head><base href="${new URL('../dist/',location.href)}"><script>${shim}<\/script>`);
 }else{frame.removeAttribute('srcdoc');frame.src='../dist/practice.html?qa='+Date.now();}
 await loaded;
 await waitFor(()=>frame.contentDocument.querySelector('#pause')?.textContent==='Resume','practice module');
 frame.contentWindow.addEventListener('error',e=>errors.push(e.message));
 frame.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 return frame.contentDocument;
}
const assert=(condition,message)=>{if(!condition)throw new Error(message);report.textContent+='✓ '+message+'\n';};
const rect=node=>node.getBoundingClientRect();
function checkViewport(doc,width,height,label){
 const win=frame.contentWindow;
 assert(doc.documentElement.scrollHeight<=height+1&&doc.documentElement.scrollWidth<=width+1,label+': no page scrolling');
 for(const id of ['play','pickup','hint','hand','highest','character-room']){
  const box=rect(doc.getElementById(id));assert(box.width>0&&box.height>0&&box.top>=0&&box.bottom<=height+1&&box.right<=width+1,label+': '+id+' remains in the viewport');
 }
 if(width<=700)for(const id of ['play','pickup','hint'])assert(rect(doc.getElementById(id)).height>=48,label+': '+id+' touch target');
 assert(win.getComputedStyle(doc.querySelector('#character-room')).display!=='none',label+': portraits always visible');
 assert(!doc.querySelector('#focus-table')&&!doc.querySelector('#atmosphere-open')&&!doc.querySelector('#atmosphere-dialog'),label+': mode controls removed');
 assert(doc.querySelectorAll('#seats .seat').length===7&&doc.querySelectorAll('#self-seat .seat').length===1,label+': seven portrait seats and local seat retained');
 const handCard=doc.querySelector('#hand .card');if(handCard)assert(rect(handCard).height>=50,label+': hand cards remain readable');
}
async function run(){
 report.textContent='';errors=[];status.textContent='Running…';document.querySelector('#run').disabled=true;
 try{
  for(const [width,height] of [[320,568],[568,320],[390,844],[700,900],[844,390],[1024,600],[1440,900]]){
   const doc=await load('defense',width,height);const label=width+'×'+height;
   checkViewport(doc,width,height,label);
   doc.querySelector('#pause').click();
   for(const c of [h('8'),s('8'),b('8')])doc.querySelector(`[data-card-id="${CSS.escape(c.id)}"]`).click();
   assert(doc.querySelectorAll('.defense-pair.covered').length===3,label+': rearranged defense covers every target');
   assert(!doc.querySelector('#play').disabled,label+': valid defense enables Play');
   checkViewport(doc,width,height,label+' with defense');
   doc.querySelector('#sort').click();assert(doc.querySelectorAll('#hand .selected').length===3,label+': sorting preserves selection');
   doc.querySelector('#pause').click();
  }
  let doc=await load('five',320,568);doc.querySelector('#pause').click();
  for(const c of ['9','10','J','Q','K'].map(h))doc.querySelector(`[data-card-id="${CSS.escape(c.id)}"]`).click();
  assert(doc.querySelectorAll('.defense-pair.covered').length===5,'five-card defense remains usable');
  checkViewport(doc,320,568,'five-card mobile');
  doc=await load('sleep',390,844);doc.querySelector('#pause').click();
  assert(doc.querySelector('#sleep-label').textContent.includes('7/8'),'restored chain shows 7/8');
  assert(doc.querySelector('.seat-1 .turn-marker').textContent==='After pickup','seventh-play next seat remains conditional');
  doc.querySelector(`[data-card-id="${CSS.escape(s('3').id)}"]`).click();doc.querySelector('#play').click();
  await waitFor(()=>doc.querySelector('#card-motion').dataset.motion==='sleep','sleep animation');
  assert(doc.querySelector('#sleep-label').textContent.includes('8/8'),'sleep animation shows 8/8');
  await waitFor(()=>doc.querySelector('#sleep-label').textContent.includes('0/8')&&!doc.querySelector('#hint').disabled,'sleep settles');
  assert(doc.querySelector('.seat-0 .turn-marker').textContent==='Playing','eighth actor retains lead after refill');
  doc=await load('win',390,844);doc.querySelector('#pause').click();doc.querySelector(`[data-card-id="${CSS.escape(s('3').id)}"]`).click();doc.querySelector('#play').click();
  await waitFor(()=>doc.querySelector('#round-dialog').open,'round win');
  assert(doc.querySelectorAll('.next-seat').length===0,'victory removes next-turn guidance');
  assert(rect(doc.querySelector('#round-dialog')).bottom<=844,'result dialog fits screen');
  doc=await load('pickup',390,844);doc.querySelector('#pause').click();
  const pile=doc.querySelector('#highest');assert(pile.scrollWidth>pile.clientWidth,'accumulated pile scrolls inside its own area');
  const target=rect(doc.querySelector('.latest-play')),pileBox=rect(pile);assert(target.right<=pileBox.right+1&&target.left>=pileBox.left-1,'latest target starts in view');
  doc.querySelector('#pickup').click();await waitFor(()=>doc.querySelector('#card-motion').dataset.motion==='pickup','pickup');
  frame.width=700;await waitFor(()=>doc.querySelector('#felt').getAttribute('aria-busy')==='false','resize settles');
  doc.querySelector('#pause').click();assert(doc.querySelectorAll('.flying-card').length===0,'resize cleans up flying cards');
  assert(doc.querySelectorAll('#hand .card').length===13,'resize preserves the committed pickup');
  frame.width=390;await waitFor(()=>frame.contentWindow.innerWidth===390);
  const hand=doc.querySelector('#hand');hand.scrollLeft=hand.scrollWidth;const oldScroll=hand.scrollLeft;doc.querySelector('#sort').click();
  assert(Math.abs(hand.scrollLeft-oldScroll)<2,'large-hand sorting preserves scroll');
  const template=hand.firstElementChild;while(hand.children.length<43)hand.append(template.cloneNode(true));
  assert(hand.scrollWidth>hand.clientWidth,'43-card hand scrolls within its area');checkViewport(doc,390,844,'large hand');
  doc=await load('defense',390,844);doc.querySelector('#pause').click();doc.querySelector(`[data-card-id="${CSS.escape(h('8').id)}"]`).click();
  frame.width=844;frame.height=390;await waitFor(()=>frame.contentWindow.innerWidth===844);
  checkViewport(doc,844,390,'rotated landscape');assert(doc.querySelectorAll('#hand .selected').length===1,'orientation preserves selection');
  doc=await load('defense',390,844,{noWebGL:true,noAudio:true,reduced:true});
  await waitFor(()=>doc.querySelector('#character-room').dataset.renderer==='fallback','static fallback');
  assert(doc.querySelectorAll('.character-fallback img').length===7,'WebGL fallback retains portraits');
  assert(doc.body.classList.contains('motion-off'),'device reduced motion is still respected');
  doc.querySelector('#pause').dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{bubbles:true}));doc.querySelector('#pause').click();
  for(const c of [h('8'),s('8'),b('8')])doc.querySelector(`[data-card-id="${CSS.escape(c.id)}"]`).click();doc.querySelector('#play').click();
  await waitFor(()=>doc.querySelector('#felt').getAttribute('aria-busy')==='false');assert(doc.querySelectorAll('.flying-card').length===0,'reduced motion skips card movement');
  assert(errors.length===0,'no uncaught browser errors or rejections');
  status.textContent='All browser checks passed';
  doc=await load('defense',390,844);doc.querySelector('#pause').click();
  for(const c of [h('8'),s('8')])doc.querySelector(`[data-card-id="${CSS.escape(c.id)}"]`).click();
 }catch(error){status.textContent='Failed';report.textContent+='✗ '+error.stack+'\n';}finally{document.querySelector('#run').disabled=false;}
}
document.querySelector('#run').onclick=run;
document.querySelector('#clean').onclick=()=>{document.querySelector('header').hidden=true;report.hidden=true;frame.style.margin='0 auto';window.scrollTo(0,0);frame.contentWindow.scrollTo(0,0);};
document.querySelector('#load').onclick=()=>load(document.querySelector('#scenario').value,Number(document.querySelector('#width').value),Number(document.querySelector('#height').value));
await load();
</script>
